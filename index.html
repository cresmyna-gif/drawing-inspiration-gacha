<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>畫畫靈感扭蛋機</title>
    <link rel="stylesheet" href="style.css"> <!-- 連結 CSS 檔案 -->
</head>
<body>
    <div class="container">
        <h1>畫畫靈感扭蛋機</h1>
        
        <!-- 顯示靈感的區域 -->
        <div id="inspirationDisplay">
            按下扭蛋機獲得靈感！
        </div>
        
        <!-- 歷史紀錄標題與清單 -->
        <div class="history-container">
            <h3>歷史紀錄 (關閉網頁即清除。可以把想得到的詞句記錄下來，成為畫畫的主題。就算沒有用到這些靈感，能夠善用想像力的你也很棒喔~)</h3>
            <ul id="historyList">
                <!-- 歷史紀錄將由 JavaScript 動態加入這裡 -->
            </ul>
        </div>

        <!-- 扭蛋按鈕 -->
        <button id="rollButton">
            抽取靈感扭蛋
        </button>
    </div>

    <script src="script.js"></script> <!-- 連結 JavaScript 檔案 -->
</body>
</html>
